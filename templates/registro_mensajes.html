<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOCA - Registro de mensajes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f5f5f5; }
        h1 { color: #222; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .link-volver { text-decoration: none; padding: 8px 14px; border-radius: 4px; background: #555; color: white; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; font-size: 13px; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>📋 Registro de mensajes</h1>
    <a href="/" class="link-volver">← Volver al panel</a>
</div>

<table>
    <tr>
        <th>Fecha y Hora</th>
        <th>Mensaje</th>
    </tr>
    {% for registro in registros %}
    <tr>
        <td>{{ registro.fecha_y_hora }}</td>
        <td>{{ registro.texto }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
