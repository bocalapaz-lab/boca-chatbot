<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOCA - Registro de mensajes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-900: #0d4f4a;
            --teal-700: #14746c;
            --teal-100: #e3f2f0;
            --ink: #1f2937;
            --bg: #f6f8f8;
            --card: #ffffff;
            --line: #e6ebe9;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', Arial, sans-serif; margin: 30px; background: var(--bg); color: var(--ink); }
        h1 { font-family: 'Manrope', Arial, sans-serif; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .link-volver { text-decoration: none; padding: 8px 14px; border-radius: 6px; background: #555; color: white; font-size: 14px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; font-size: 13px; }
        th { background: var(--teal-100); color: var(--teal-900); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; font-size: 12px; }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>📋 Registro de mensajes</h1>
    <a href="/" class="link-volver">← Volver al panel</a>
</div>

<table>
    <tr>
        <th>Fecha y Hora</th>
        <th>Mensaje</th>
    </tr>
    {% for registro in registros %}
    <tr>
        <td>{{ registro.fecha_y_hora }}</td>
        <td>{{ registro.texto }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
